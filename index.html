<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16466f">
<meta name="description" content="A private start to understanding male fertility. Explore a check-in, learning guides and a connected care demonstration.">
<title>Sirr — Your health. Your pace.</title>
<link rel="stylesheet" href="styles.css?v=sirr-video-responsive-5">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>
    <div>
      <strong data-i18n="brand">Sirr.</strong>
      <span class="brand-sub" data-i18n="brandSub">Demo workspace</span>
    </div>
  </div>
  <button id="langToggle" class="ghost" type="button">العربية</button>
</header>

<details class="demo-controls"><summary data-i18n="demoControls">Demo controls · simulated roles</summary>
<div class="demo-menu">
<nav class="tabs" role="tablist" aria-label="Demo roles">
  <button class="tab active" data-role="patient" role="tab" data-i18n="tabPatient">Patient</button>
  <button class="tab" data-role="dispatch" role="tab" data-i18n="tabDispatch">Dispatch</button>
  <button class="tab" data-role="lab" role="tab" data-i18n="tabLab">Lab</button>
  <button class="tab" data-role="clinician" role="tab" data-i18n="tabClinician">Clinician</button>
</nav>
<div class="scenario-panel">
  <p data-i18n="scenarioHelp">Shortcuts switch to synthetic demo previews. Existing bookings are kept.</p>
  <div class="scenario-buttons" role="group" aria-label="Demo scenarios">
    <button type="button" data-scenario="welcome" data-i18n="scenarioWelcome">New patient</button>
    <button type="button" data-scenario="prepare" data-i18n="scenarioPrepare">Ready to collect</button>
    <button type="button" data-scenario="transit" data-i18n="scenarioTransit">In transit</button>
    <button type="button" data-scenario="review" data-i18n="scenarioReview">Review pending</button>
    <button type="button" data-scenario="report" data-i18n="scenarioReport">Report ready</button>
    <button type="button" data-scenario="late" data-i18n="scenarioLate">Late arrival</button>
    <button type="button" data-scenario="seal" data-i18n="scenarioSeal">Seal issue</button>
  </div>
</div>
</div>
</details>

<div id="notice" class="notice" hidden></div>
<main id="view"></main>

<script src="js/i18n.js?v=sirr-video-responsive-5"></script>
<script src="js/state.js?v=sirr-video-responsive-5"></script>
<script src="js/videos.js?v=sirr-video-responsive-5"></script>
<script src="js/journey.js?v=sirr-video-responsive-5"></script>
<script src="js/learn-visual.js?v=sirr-video-responsive-5"></script>
<script src="js/chat.js?v=sirr-video-responsive-5"></script>
<script src="js/app.js?v=sirr-video-responsive-5"></script>
</body>
</html>
